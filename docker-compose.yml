version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql-appointment-dev
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: appointmentdb
      MYSQL_USER: appointment
      MYSQL_PASSWORD: 20aptm26
      TZ: America/Sao_Paulo
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --default-authentication-plugin=mysql_native_password
      - --default-time-zone=-03:00
    networks:
      - devnet

volumes:
  mysql_data:

networks:
  devnet:
    driver: bridge
