services:
  - type: web
    name: appointment-system-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      # Banco (TiDB Cloud Serverless) — cole a connection string no painel do Render
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL
        value: "true"
      # JWT
      - key: SECRET_KEY
        sync: false
      # Google Calendar (OAuth)
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      # Token do endpoint de sync e do canal de push (X-Goog-Channel-Token)
      - key: GOOGLE_SYNC_TOKEN
        sync: false
      # URL pública do webhook de push (domínio verificado no Google Cloud)
      - key: GOOGLE_WEBHOOK_URL
        sync: false
      # WhatsApp Cloud API
      - key: WPP_VERIFY_TOKEN
        sync: false
      - key: WPP_TOKEN
        sync: false
